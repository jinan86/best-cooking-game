<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sizzle &amp; Serve — a tiny kitchen rush</title>
<link rel="icon" href="data:,">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #2b1a0e;
    min-height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Trebuchet MS", Verdana, sans-serif;
  }
  #wrap {
    text-align: center;
    padding: 12px;
  }
  canvas {
    display: block;
    width: min(1280px, 96vw);
    height: auto;
    image-rendering: auto;
    border: 4px solid #5d4028;
    border-radius: 8px;
    background: #f3e2c2;
    cursor: pointer;
  }
  #hint {
    color: #e8c98a;
    font-size: 13px;
    margin-top: 8px;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hint">Sizzle &amp; Serve — cook, chop, plate, serve. WASD / arrows to walk, E to use a station, click a station to walk there.</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
